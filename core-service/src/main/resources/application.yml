server:
  port: ${SERVER_PORT:8080}
spring:
  application:
    name: coopledger-core
  task:
    scheduling:
      pool:
        size: 2
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/coopledger}
    username: ${DB_USER:coopledger}
    password: ${DB_PASSWORD:coopledger}
    hikari:
      maximum-pool-size: 12
      connection-init-sql: "SET lock_timeout = '10s'"
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    locations: classpath:db/migration
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  mvc:
    problemdetails:
      enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    admin:
      fail-fast: false
      properties:
        default.api.timeout.ms: 5000
        request.timeout.ms: 2000
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        max.block.ms: 1000
        delivery.timeout.ms: 5000
        request.timeout.ms: 2000
management:
  server:
    port: ${MANAGEMENT_PORT:9091}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
      roles: OPS
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
        coopledger.transfer.duration: true
coopledger:
  security:
    secret: ${JWT_SECRET_BASE64}
  outbox:
    enabled: ${OUTBOX_ENABLED:true}
