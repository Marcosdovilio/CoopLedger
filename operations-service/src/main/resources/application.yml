server:
  port: ${SERVER_PORT:8082}
spring:
  application:
    name: coopledger-operations
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/operations}
    username: ${DB_USER:coopledger}
    password: ${DB_PASSWORD:coopledger}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  mvc:
    problemdetails:
      enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: coopledger-operations-v1
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      max-poll-records: 50
    listener:
      ack-mode: record
      auto-startup: ${KAFKA_LISTENER_ENABLED:true}
management:
  server:
    port: ${MANAGEMENT_PORT:9093}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
      roles: OPS
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
coopledger:
  security:
    secret: ${JWT_SECRET_BASE64}
