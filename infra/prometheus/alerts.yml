groups:
  - name: coopledger
    rules:
      - alert: OutboxDelayed
        expr: coopledger_outbox_oldest_age_seconds > 60
        for: 1m
        labels: {severity: warning}
        annotations:
          summary: "Eventos aguardam publicação há mais de 60 segundos"
      - alert: OutboxGrowing
        expr: coopledger_outbox_pending > 100
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "Outbox acumula mais de 100 eventos"
      - alert: ApiErrors
        expr: sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m])) > 0.1
        for: 2m
        labels: {severity: warning}
        annotations:
          summary: "Erros HTTP 5xx no CoopLedger"
