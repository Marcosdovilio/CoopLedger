global:
  scrape_interval: 5s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: coopledger-core
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["core:9091"]
  - job_name: coopledger-operations
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["operations:9093"]
