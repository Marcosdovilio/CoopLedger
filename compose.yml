name: coopledger
services:
  core-db:
    image: postgres:17.7
    environment:
      POSTGRES_DB: coopledger
      POSTGRES_USER: coopledger
      POSTGRES_PASSWORD: ${DB_PASSWORD:-coopledger}
    ports: ["127.0.0.1:15432:5432"]
    volumes: ["core-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coopledger -d coopledger"]
      interval: 3s
      timeout: 3s
      retries: 20

  operations-db:
    image: postgres:17.7
    environment:
      POSTGRES_DB: operations
      POSTGRES_USER: coopledger
      POSTGRES_PASSWORD: ${DB_PASSWORD:-coopledger}
    ports: ["127.0.0.1:15433:5432"]
    volumes: ["operations-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coopledger -d operations"]
      interval: 3s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:3.9.1
    ports: ["127.0.0.1:9092:9092"]
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes: ["kafka-data:/var/lib/kafka/data"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30

  core:
    build:
      context: .
      args: {SERVICE: core-service}
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      DB_URL: jdbc:postgresql://core-db:5432/coopledger
      DB_PASSWORD: ${DB_PASSWORD:-coopledger}
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      JWT_SECRET_BASE64: ${JWT_SECRET_BASE64:-bG9jYWwtY29vcGxlZGdlci1kZW1vLWtleS0zMi1ieXRlcy1taW5pbXVt}
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      core-db: {condition: service_healthy}
      kafka: {condition: service_started}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9091/actuator/health"]
      interval: 5s
      timeout: 3s
      start_period: 45s
      retries: 30

  operations:
    build:
      context: .
      args: {SERVICE: operations-service}
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      DB_URL: jdbc:postgresql://operations-db:5432/operations
      DB_PASSWORD: ${DB_PASSWORD:-coopledger}
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      JWT_SECRET_BASE64: ${JWT_SECRET_BASE64:-bG9jYWwtY29vcGxlZGdlci1kZW1vLWtleS0zMi1ieXRlcy1taW5pbXVt}
    ports: ["127.0.0.1:8082:8082"]
    depends_on:
      operations-db: {condition: service_healthy}
      kafka: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9093/actuator/health"]
      interval: 5s
      timeout: 3s
      start_period: 45s
      retries: 30

  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: [monitoring]
    ports: ["127.0.0.1:9090:9090"]
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana:12.1.1
    profiles: [monitoring]
    ports: ["127.0.0.1:3000:3000"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-coopledger-demo}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on: [prometheus]

volumes:
  core-data:
  operations-data:
  kafka-data:
  prometheus-data:
  grafana-data:
